[package]
name = "fde-03-legacy-etl"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mainframe records, messy CSVs and document text turned into clean, reconciled data."
repository = "https://github.com/braylo-ai/fde-03-legacy-etl"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fde-03-legacy-etl"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
hmac = "=0.12.1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
